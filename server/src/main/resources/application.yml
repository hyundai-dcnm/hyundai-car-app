# 값 형식: ${환경변수이름:기본값}
# 내 컴퓨터에서는 기본값(H2 파일 DB, 사진은 폴더)으로 돌고, 배포(Render)에서는 환경 변수로 바꿔 넣는다.
# 이 파일에 실제 비밀번호 및 키를 적지 않는다 -> Render 환경 변수에만 작성
spring:
  application:
    name: donghaeng-server
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/donghaeng;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # 엔티티를 보고 표를 자동으로 만들거나 열을 추가한다.
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
  # Render 같은 프록시 뒤에서 https 주소를 올바르게 알아보게 한다.
  forward-headers-strategy: framework

app:
  cors:
    # 쉼표로 여러 개
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}

storage:
  type: ${STORAGE_TYPE:local}
  local-dir: ${STORAGE_LOCAL_DIR:./data/photos}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:}
    bucket: ${S3_BUCKET:trip-photos}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health