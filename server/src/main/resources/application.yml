spring:
  application:
    name: donghaeng-server
  # 기본은 메모리 H2. PostgreSQL은 --spring.profiles.active=postgres (docker compose up -d 먼저)
  datasource:
    url: jdbc:h2:mem:donghaeng
  jpa:
    open-in-view: false

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/donghaeng
    username: donghaeng
    password: donghaeng
