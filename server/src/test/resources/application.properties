# 모든 서버 테스트에 공통으로 덮어쓰는 설정. 나머지는 src/main/resources/application.yml 을 그대로 쓴다.
# 같은 위치의 .properties 가 .yml 보다 우선한다.

# 테스트 DB. 기본은 메모리 DB(H2)라서 내 컴퓨터 data 폴더를 건드리지 않는다.
# CI 는 TEST_DATABASE_* 환경 변수로 운영과 같은 PostgreSQL 을 넣는다.
# 배포용 DATABASE_* 와 이름을 나눠, 운영 DB 주소가 설정된 환경에서도 테스트가 운영 DB 에 붙지 않게 한다.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DATABASE_USERNAME:sa}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}

# 사진은 항상 로컬 폴더에 저장한다(S3 키 없이 실행).
storage.type=local
