# 서버 자동 검사(CI). server/ 가 바뀐 PR과 main 커밋에서 서버 빌드와 테스트를 실행한다.
# 차량 앱(app/, core/, feature/)만 바뀐 PR에서는 실행하지 않는다.
name: server-ci

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

# 코드를 읽기만 한다(저장소에 쓰기 권한 없음).
permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 실행은 취소하고 최신 것만 검사한다.
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: server-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    # 운영(Supabase)과 같은 PostgreSQL 로 테스트한다. H2 로는 확인되지 않는 표 생성(DDL), 잠금, 타입 차이를 PR 에서 잡기 위함.
    # 실행이 끝나면 컨테이너와 함께 사라지는 빈 DB 라서 아래 비밀번호는 공개해도 되는 테스트 값이다.
    # 이미지 버전은 Supabase 프로젝트의 PostgreSQL 주 버전과 맞춘다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: donghaeng_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # DB 가 접속을 받을 준비가 된 뒤에 테스트를 시작한다.
        options: >-
          --health-cmd "pg_isready -U postgres -d donghaeng_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # server/src/test/resources/application.properties 가 읽는 테스트 DB 주소(없으면 H2)
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/donghaeng_test
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: postgres

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          # 검사만 하고 push 하지 않으므로 GitHub 인증 정보를 남기지 않는다.
          persist-credentials: false

      - name: JDK 17 설치 (Gradle 내려받은 파일 재사용)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            server/*.gradle.kts
            server/gradle/wrapper/gradle-wrapper.properties

      # build = 컴파일 + 테스트 + 실행 파일(bootJar) 만들기.
      # Render 의 Dockerfile 도 bootJar 로 빌드하므로, 배포 때 날 패키징 오류를 PR 에서 먼저 잡는다.
      - name: 서버 빌드 및 테스트
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: 실패하면 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-report
          path: server/build/reports/tests/test
          retention-days: 7
